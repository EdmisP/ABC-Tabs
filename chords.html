<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chord Generator · Finland ABC Archive and Tab Maker</title>
<meta name="description" content="Chord generator with sheet music and tablature for the instruments in the Finland ABC Archive and Tab Maker">
<meta name="theme-color" content="#003580">
<meta name="application-name" content="Finland ABC Archive and Tab Maker">
<meta name="apple-mobile-web-app-title" content="Finland ABC Archive">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="app.webmanifest">
<link rel="stylesheet" href="styles.css?v=76">
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.6.4/dist/abcjs-basic-min.js"></script>
<style>
  .chord-controls{display:grid;grid-template-columns:minmax(190px,1.3fr) minmax(140px,.8fr) minmax(170px,.9fr) minmax(180px,1fr);gap:10px;align-items:end}
  .chord-controls label,.sub-controls label{display:flex;flex-direction:column;gap:4px}
  .sub-controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:10px}
  .chord-output{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:12px}
  .chord-name{font:700 30px Georgia,"Times New Roman",serif;color:#002f6c;text-align:center;margin:5px 0 8px}
  .staff-box,.tab-box{border:1px solid #9cb6d3;background:#fff;padding:10px;min-height:245px}
  #chordStaff{min-height:185px;display:flex;align-items:center;justify-content:center}
  #chordStaff svg{max-width:100%;height:auto;color:#003580}
  #chordStaff svg path{fill:#003580;stroke:#003580}
  #chordStaff svg text{fill:#003580}
  .tab-title{font-weight:700;color:#003580;margin-bottom:10px}
  .tab-grid{display:grid;gap:8px;padding:4px 0}
  .tab-row{display:grid;grid-template-columns:94px minmax(0,1fr);align-items:center;min-height:28px}
  .tab-label{font-size:12px;font-weight:700;color:#31577f;padding-right:7px;text-align:right;white-space:nowrap}
  .tab-line{position:relative;border-top:1px solid #2d6bb2;min-height:26px}
  .tab-value{position:absolute;left:50%;top:-10px;transform:translateX(-50%);background:#fff;padding:0 6px;font-weight:700;color:#003580;white-space:nowrap}
  .tab-value.muted{color:#67727d;font-weight:600}
  .two-bar .tab-value{font-size:13px}
  .voicing-info{margin-top:10px;font-size:12px;color:#31577f;line-height:1.45}
  .warning-box{margin-top:10px;padding:7px 9px;border:1px solid #b8c5d2;background:#f2f4f6;color:#303943;font-size:12px}
  .chord-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
  .chord-table th,.chord-table td{border:1px solid #a9b7c6;padding:5px 7px;text-align:left}
  .chord-table th{background:#edf1f5;color:#003580}
  .inline-note-inputs{display:flex;gap:5px;flex-wrap:wrap}
  .inline-note-inputs label{display:grid;grid-template-columns:22px 76px;align-items:center;gap:3px}
  .inline-note-inputs input{width:76px}
  @media(max-width:900px){.chord-output{grid-template-columns:1fr}.chord-controls{grid-template-columns:1fr 1fr}.staff-box,.tab-box{min-height:0}}
  @media(max-width:560px){.chord-controls{grid-template-columns:1fr}.tab-row{grid-template-columns:76px minmax(0,1fr)}}
</style>
</head>
<body>
<main class="container">
  <header class="titlebar">
    <div class="brand-lockup">
      <span class="finland-flag" role="img" aria-label="Flag of Finland"></span>
      <div><h1>Finland ABC Archive and Tab Maker</h1></div>
    </div>
    <div class="actions">
      <button id="tabMakerBtn" type="button">Tab maker</button>
    </div>
  </header>

  <section class="panel controls">
    <div class="chord-controls">
      <label>Instrument
        <select id="instrumentPreset">
          <option value="balalaika_prima">Prima Balalaika</option>
          <option value="domra_prima">Prima Domra</option>
          <option value="waldzither">Waldzither</option>
          <option value="mandolin">Mandolin</option>
          <option value="citera">Citera</option>
          <option value="musima_chord_zither">Musima Chord Zither</option>
          <option value="tamburitza">Tamburitza (12-TET)</option>
          <option value="dulcimer">Appalachian dulcimer</option>
          <option value="kantele">Kantele</option>
        </select>
      </label>

      <label>Root
        <select id="rootSelect">
          <option value="0|C">C</option>
          <option value="1|C♯">C♯</option>
          <option value="1|D♭">D♭</option>
          <option value="2|D">D</option>
          <option value="3|D♯">D♯</option>
          <option value="3|E♭">E♭</option>
          <option value="4|E">E</option>
          <option value="5|F">F</option>
          <option value="6|F♯">F♯</option>
          <option value="6|G♭">G♭</option>
          <option value="7|G" selected>G</option>
          <option value="8|G♯">G♯</option>
          <option value="8|A♭">A♭</option>
          <option value="9|A">A</option>
          <option value="10|A♯">A♯</option>
          <option value="10|B♭">B♭</option>
          <option value="11|B">B</option>
        </select>
      </label>

      <label>Chord
        <select id="qualitySelect">
          <option value="major" selected>Major</option>
          <option value="minor">Minor</option>
          <option value="5">5</option>
          <option value="dim">Diminished</option>
          <option value="aug">Augmented</option>
          <option value="sus2">sus2</option>
          <option value="sus4">sus4</option>
          <option value="6">6</option>
          <option value="m6">m6</option>
          <option value="7">7</option>
          <option value="maj7">maj7</option>
          <option value="m7">m7</option>
          <option value="m7b5">m7♭5</option>
          <option value="dim7">dim7</option>
          <option value="add9">add9</option>
          <option value="madd9">m(add9)</option>
          <option value="9">9</option>
          <option value="maj9">maj9</option>
          <option value="m9">m9</option>
        </select>
      </label>

      <label>Voicing
        <select id="voicingSelect"></select>
      </label>
    </div>

    <div id="subControls" class="sub-controls"></div>
  </section>

  <section class="panel">
    <h2 id="pageHeading">Chord generator</h2>
    <div id="chordName" class="chord-name">G</div>

    <div class="chord-output">
      <div class="staff-box">
        <div class="tab-title">Sheet music</div>
        <div id="chordStaff"></div>
      </div>
      <div class="tab-box">
        <div id="tabTitle" class="tab-title">Tablature</div>
        <div id="chordTab" class="tab-grid"></div>
        <div id="voicingInfo" class="voicing-info"></div>
        <div id="warningBox"></div>
      </div>
    </div>

    <table class="chord-table">
      <thead><tr><th>Chord tones</th><th>Notes used in this voicing</th></tr></thead>
      <tbody><tr><td id="toneNames"></td><td id="voicingNotes"></td></tr></tbody>
    </table>
  </section>
</main>

<script>
'use strict';

const NOTE_NAMES_SHARP=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const NOTE_NAMES_FLAT=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];

const CHORDS={
  major:{suffix:'',intervals:[0,4,7],weights:[1000,560,230]},
  minor:{suffix:'m',intervals:[0,3,7],weights:[1000,560,230]},
  '5':{suffix:'5',intervals:[0,7],weights:[1000,430]},
  dim:{suffix:'dim',intervals:[0,3,6],weights:[1000,560,300]},
  aug:{suffix:'aug',intervals:[0,4,8],weights:[1000,560,300]},
  sus2:{suffix:'sus2',intervals:[0,2,7],weights:[1000,520,250]},
  sus4:{suffix:'sus4',intervals:[0,5,7],weights:[1000,520,250]},
  '6':{suffix:'6',intervals:[0,4,7,9],weights:[1000,560,180,380]},
  m6:{suffix:'m6',intervals:[0,3,7,9],weights:[1000,560,180,380]},
  '7':{suffix:'7',intervals:[0,4,7,10],weights:[1000,560,150,520]},
  maj7:{suffix:'maj7',intervals:[0,4,7,11],weights:[1000,560,150,520]},
  m7:{suffix:'m7',intervals:[0,3,7,10],weights:[1000,560,150,520]},
  m7b5:{suffix:'m7♭5',intervals:[0,3,6,10],weights:[1000,560,280,520]},
  dim7:{suffix:'dim7',intervals:[0,3,6,9],weights:[1000,560,320,470]},
  add9:{suffix:'add9',intervals:[0,4,7,14],weights:[1000,560,160,390]},
  madd9:{suffix:'m(add9)',intervals:[0,3,7,14],weights:[1000,560,160,390]},
  '9':{suffix:'9',intervals:[0,4,7,10,14],weights:[1000,560,100,520,350]},
  maj9:{suffix:'maj9',intervals:[0,4,7,11,14],weights:[1000,560,100,520,350]},
  m9:{suffix:'m9',intervals:[0,3,7,10,14],weights:[1000,560,100,520,350]}
};

const GENERIC_INSTRUMENTS={
  balalaika_prima:{
    label:'Prima Balalaika',
    tunings:{standard:{label:'Standard — E4 E4 A4',courses:[['E4'],['E4'],['A4']]}}
  },
  domra_prima:{
    label:'Prima Domra',
    tunings:{
      three_string:{label:'3-string — E4 A4 D5',courses:[['E4'],['A4'],['D5']]},
      four_string:{label:'4-string — G3 D4 A4 E5',courses:[['G3'],['D4'],['A4'],['E5']]}
    }
  },
  waldzither:{
    label:'Waldzither',
    tunings:{
      standard:{label:'Standard/common — C3 G3/G3 C4/C4 E4/E4 G4/G4',courses:[['C3'],['G3','G3'],['C4','C4'],['E4','E4'],['G4','G4']]},
      d_tuning:{label:'D tuning — D3 A3/A3 D4/D4 F♯4/F♯4 A4/A4',courses:[['D3'],['A3','A3'],['D4','D4'],['F♯4','F♯4'],['A4','A4']]},
      open_g_major:{label:'Open G major — G2 D3/D3 G3/G3 B3/B3 D4/D4',courses:[['G2'],['D3','D3'],['G3','G3'],['B3','B3'],['D4','D4']]}
    }
  },
  mandolin:{
    label:'Mandolin',
    tunings:{standard:{label:'Standard — G3 D4 A4 E5',courses:[['G3','G3'],['D4','D4'],['A4','A4'],['E5','E5']]}}
  },
  tamburitza:{
    label:'Tamburitza',
    tunings:{
      d_tuning:{label:'D3–A4–D4',courses:[['D3'],['A4'],['D4']]},
      c_tuning:{label:'C3–G4–C4',courses:[['C3'],['G4'],['C4']]}
    }
  }
};

const DULCIMER_TUNINGS={
  dad:{label:'DAD',notes:['D3','A3','D4']},
  cgc:{label:'CGC',notes:['C3','G3','C4']},
  daa:{label:'DAA',notes:['D3','A3','A3']},
  dfsa:{label:'D–F♯–A',notes:['D3','F♯3','A3']},
  fac:{label:'FAC',notes:['F3','A3','C4']}
};
const DULCIMER_FRETS=[['0',0],['1',2],['2',4],['3',5],['4',7],['5',9],['6',10],['6½',11],['7',12],['8',14],['9',16],['10',17],['11',19],['12',21],['13',22],['13½',23],['14',24]];

const CITERA_BOTTOM=[[0,67,'G4'],[1,69,'A4'],[2,71,'B4'],[3,72,'C5'],[4,74,'D5'],[5,76,'E5'],[6,77,'F5'],[7,79,'G5'],[8,81,'A5'],[9,83,'B5'],[10,84,'C6'],[11,86,'D6'],[12,88,'E6'],[13,89,'F6'],[14,91,'G6'],[15,93,'A6'],[16,95,'B6'],[17,96,'C7']];
const CITERA_TOP=[[1,68,'G♯4'],[2,70,'A♯4'],[3,73,'C♯5'],[4,75,'D♯5'],[5,78,'F♯5'],[6,80,'G♯5'],[7,82,'A♯5'],[8,85,'C♯6'],[9,87,'D♯6'],[10,90,'F♯6'],[11,92,'G♯6'],[12,94,'A♯6']];
const MUSIMA_BOTTOM=[[1,60,'C4'],[2,62,'D4'],[3,64,'E4'],[4,65,'F4'],[5,67,'G4'],[6,69,'A4'],[7,71,'B4'],[8,72,'C5'],[9,74,'D5'],[10,76,'E5'],[11,77,'F5'],[12,79,'G5'],[13,81,'A5'],[14,83,'B5'],[15,84,'C6']];
const MUSIMA_TOP=[[1,61,'C♯4'],[2,63,'D♯4'],[4,66,'F♯4'],[5,68,'G♯4'],[8,73,'C♯5'],[9,75,'D♯5'],[11,78,'F♯5'],[12,80,'G♯5'],[13,82,'A♯5']];

const KANTELE_DEFAULTS={
  5:['G3','A3','B3','D4','E4'],
  7:['G3','A3','B3','C4','D4','E4','F♯4']
};
let kanteleState={5:[...KANTELE_DEFAULTS[5]],7:[...KANTELE_DEFAULTS[7]]};
let voicings=[];

function mod(n,m=12){return ((n%m)+m)%m}
function noteToMidi(note){
  const clean=String(note).trim().replaceAll('♯','#').replaceAll('♭','b');
  const m=clean.match(/^([A-Ga-g])([#b]?)(-?\d+)$/);
  if(!m) throw new Error('Invalid note: '+note);
  const pcs={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  let pc=pcs[m[1].toUpperCase()]+(m[2]==='#'?1:m[2]==='b'?-1:0);
  return 12*(Number(m[3])+1)+pc;
}
function midiName(midi,preferFlats=false){
  const names=preferFlats?NOTE_NAMES_FLAT:NOTE_NAMES_SHARP;
  return `${names[mod(midi)]}${Math.floor(midi/12)-1}`;
}
function selectedRoot(){
  const [pc,name]=document.getElementById('rootSelect').value.split('|');
  return {pc:Number(pc),name,preferFlats:name.includes('♭')};
}
function selectedChord(){return CHORDS[document.getElementById('qualitySelect').value]||CHORDS.major}
function chordTonePcs(){
  const root=selectedRoot();
  const chord=selectedChord();
  return chord.intervals.map((iv,i)=>({interval:iv,pc:mod(root.pc+iv),weight:chord.weights[i]||200}));
}
function chordName(){const r=selectedRoot();const c=selectedChord();return r.name+c.suffix}
function chordToneNames(){
  const root=selectedRoot();
  const names=root.preferFlats?NOTE_NAMES_FLAT:NOTE_NAMES_SHARP;
  return chordTonePcs().map(x=>names[x.pc]);
}
function instrumentId(){return document.getElementById('instrumentPreset').value}

function setupSubControls(){
  const host=document.getElementById('subControls');
  const id=instrumentId();
  host.innerHTML='';
  if(GENERIC_INSTRUMENTS[id]){
    const wrap=document.createElement('label');
    wrap.textContent='Tuning';
    const select=document.createElement('select'); select.id='tuningSelect';
    Object.entries(GENERIC_INSTRUMENTS[id].tunings).forEach(([key,t])=>{
      const o=document.createElement('option');o.value=key;o.textContent=t.label;select.appendChild(o);
    });
    const q=new URLSearchParams(location.search);
    if(q.get('instrument')===id && q.get('tuning') && GENERIC_INSTRUMENTS[id].tunings[q.get('tuning')]) select.value=q.get('tuning');
    select.addEventListener('change',regenerate);
    wrap.appendChild(select);host.appendChild(wrap);
  }else if(id==='dulcimer'){
    const wrap=document.createElement('label');wrap.textContent='Tuning';
    const select=document.createElement('select');select.id='tuningSelect';
    Object.entries(DULCIMER_TUNINGS).forEach(([key,t])=>{const o=document.createElement('option');o.value=key;o.textContent=t.label;select.appendChild(o)});
    const q=new URLSearchParams(location.search);
    if(q.get('instrument')===id && q.get('tuning') && DULCIMER_TUNINGS[q.get('tuning')]) select.value=q.get('tuning');
    select.addEventListener('change',regenerate);wrap.appendChild(select);host.appendChild(wrap);
  }else if(id==='kantele'){
    const countWrap=document.createElement('label');countWrap.textContent='Strings';
    const count=document.createElement('select');count.id='kanteleCount';
    [5,7].forEach(n=>{const o=document.createElement('option');o.value=String(n);o.textContent=`${n} strings`;count.appendChild(o)});
    const q=new URLSearchParams(location.search);const requested=Number(q.get('strings'));
    if(requested===7) count.value='7';
    countWrap.appendChild(count);host.appendChild(countWrap);
    const notesWrap=document.createElement('div');notesWrap.id='kanteleInputs';notesWrap.className='inline-note-inputs';host.appendChild(notesWrap);
    if(q.get('instrument')===id && q.get('notes')){
      const given=q.get('notes').split(',').map(x=>x.trim()).filter(Boolean);
      if(given.length===Number(count.value)) kanteleState[Number(count.value)]=given;
    }
    const renderInputs=()=>{
      const n=Number(count.value);notesWrap.innerHTML='';
      kanteleState[n].forEach((note,i)=>{
        const l=document.createElement('label');const span=document.createElement('span');span.textContent=String(i+1);
        const input=document.createElement('input');input.value=note;input.setAttribute('aria-label',`Kantele string ${i+1}`);
        input.addEventListener('change',()=>{kanteleState[n][i]=input.value.trim();regenerate()});
        l.append(span,input);notesWrap.appendChild(l);
      });
    };
    count.addEventListener('change',()=>{renderInputs();regenerate()});renderInputs();
  }
}

function physicalCourses(){
  const id=instrumentId();
  if(GENERIC_INSTRUMENTS[id]){
    const t=GENERIC_INSTRUMENTS[id].tunings[document.getElementById('tuningSelect')?.value||Object.keys(GENERIC_INSTRUMENTS[id].tunings)[0]];
    return t.courses.map((strings,i)=>({course:i+1,openNote:strings[0],openMidi:noteToMidi(strings[0]),strings,positions:Array.from({length:13},(_,f)=>({fret:String(f),fretNumber:f,midi:noteToMidi(strings[0])+f}))}));
  }
  if(id==='dulcimer'){
    const t=DULCIMER_TUNINGS[document.getElementById('tuningSelect')?.value||'dad'];
    return t.notes.map((note,i)=>{
      const open=noteToMidi(note);
      return {course:i+1,openNote:note,openMidi:open,strings:[note],positions:DULCIMER_FRETS.map(([f,s])=>({fret:f,fretNumber:Number(String(f).replace('½','.5')),midi:open+s}))};
    });
  }
  return [];
}

function bestFrettedVoicings(){
  const courses=physicalCourses();
  const tones=chordTonePcs();
  const pcs=new Set(tones.map(t=>t.pc));
  const weights=new Map(tones.map(t=>[t.pc,Math.max(t.weight,weightsSafe(t.pc,tones))]));
  const choices=courses.map(course=>{
    const byPc=new Map();
    for(const p of course.positions){
      const pc=mod(p.midi);
      if(!pcs.has(pc)) continue;
      const prev=byPc.get(pc);
      if(!prev || p.fretNumber<prev.fretNumber) byPc.set(pc,{...p,course:course.course,openMidi:course.openMidi,openNote:course.openNote});
    }
    return [null,...byPc.values()];
  });
  const results=[];const shape=[];
  function walk(i){
    if(i===choices.length){
      const used=shape.filter(Boolean);if(!used.length)return;
      const present=new Set(used.map(x=>mod(x.midi)));
      let missingPenalty=0;for(const t of tones){if(!present.has(t.pc))missingPenalty+=t.weight}
      const frets=used.map(x=>x.fretNumber);const sounding=[...used].sort((a,b)=>a.midi-b.midi);
      const rootBass=sounding[0]&&mod(sounding[0].midi)===selectedRoot().pc;
      const muted=shape.length-used.length;
      const maxFret=Math.max(...frets);const minFret=Math.min(...frets);const total=frets.reduce((a,b)=>a+b,0);
      const duplicates=used.length-present.size;
      const score=missingPenalty*100 + maxFret*22 + total*3 + (maxFret-minFret)*8 + muted*18 + duplicates*3 + (rootBass?-30:0);
      const key=shape.map(x=>x?`${x.course}:${x.fret}`:'x').join('|');
      results.push({kind:'fretted',shape:shape.map(x=>x?{...x}:null),courses,score,key,present});
      return;
    }
    for(const c of choices[i]){shape[i]=c;walk(i+1)}
  }
  walk(0);
  results.sort((a,b)=>a.score-b.score);
  const seen=new Set();return results.filter(v=>{if(seen.has(v.key))return false;seen.add(v.key);return true}).slice(0,12);
}
function weightsSafe(pc,tones){return Math.max(...tones.filter(t=>t.pc===pc).map(t=>t.weight),0)}

function fixedPool(){
  if(instrumentId()==='citera'){
    return [
      ...CITERA_BOTTOM.map(([pos,midi,note])=>({bar:'Bottom',position:pos,midi,note})),
      ...CITERA_TOP.map(([pos,midi,note])=>({bar:'Top',position:pos,midi,note}))
    ];
  }
  return [
    ...MUSIMA_BOTTOM.map(([pos,midi,note])=>({bar:'Bottom',position:pos,midi,note})),
    ...MUSIMA_TOP.map(([pos,midi,note])=>({bar:'Top',position:pos,midi,note}))
  ];
}
function bestFixedVoicings(){
  const pool=fixedPool();const tones=chordTonePcs();
  const uniquePcs=[];const seenPc=new Set();
  [...tones].sort((a,b)=>b.weight-a.weight).forEach(t=>{if(!seenPc.has(t.pc)){seenPc.add(t.pc);uniquePcs.push(t)}});
  const selectedTones=uniquePcs.slice(0,Math.min(4,uniquePcs.length));
  const candidates=selectedTones.map(t=>pool.filter(p=>mod(p.midi)===t.pc).map(p=>({...p,weight:t.weight,pc:t.pc})));
  if(candidates.some(c=>!c.length)){
    const available=selectedTones.filter((t,i)=>candidates[i].length);
    if(!available.length)return [];
  }
  const active=candidates.filter(c=>c.length);const results=[];const pick=[];
  function walk(i){
    if(i===active.length){
      const unique=[];const used=new Set();
      for(const p of pick){const k=`${p.bar}:${p.position}`;if(!used.has(k)){used.add(k);unique.push(p)}}
      if(!unique.length)return;
      const midis=unique.map(x=>x.midi);const span=Math.max(...midis)-Math.min(...midis);const centre=Math.abs(midis.reduce((a,b)=>a+b,0)/midis.length-72);
      const score=span*12+centre*2;
      const key=unique.map(x=>`${x.bar}:${x.position}`).sort().join('|');
      results.push({kind:'fixed',notes:unique,score,key});return;
    }
    for(const c of active[i]){pick[i]=c;walk(i+1)}
  }
  walk(0);results.sort((a,b)=>a.score-b.score);const s=new Set();return results.filter(v=>{if(s.has(v.key))return false;s.add(v.key);return true}).slice(0,12);
}

function bestKanteleVoicings(){
  const n=Number(document.getElementById('kanteleCount')?.value||5);
  const strings=kanteleState[n].map((note,i)=>({string:i+1,note,midi:noteToMidi(note)}));
  const tonePcs=new Set(chordTonePcs().map(t=>t.pc));
  const matching=strings.filter(s=>tonePcs.has(mod(s.midi)));
  if(!matching.length)return [];
  return [{kind:'kantele',strings,notes:matching,score:0,key:matching.map(x=>x.string).join(',')}];
}

function generateVoicings(){
  const id=instrumentId();
  if(id==='citera'||id==='musima_chord_zither')return bestFixedVoicings();
  if(id==='kantele')return bestKanteleVoicings();
  return bestFrettedVoicings();
}

function usedMidis(v){
  if(!v)return [];
  if(v.kind==='fretted')return v.shape.filter(Boolean).map(x=>x.midi).sort((a,b)=>a-b);
  if(v.kind==='fixed')return v.notes.map(x=>x.midi).sort((a,b)=>a-b);
  return v.notes.map(x=>x.midi).sort((a,b)=>a-b);
}

function abcPitch(midi,preferFlats){
  const sharp=[['C',''],['C','^'],['D',''],['D','^'],['E',''],['F',''],['F','^'],['G',''],['G','^'],['A',''],['A','^'],['B','']];
  const flat=[['C',''],['D','_'],['D',''],['E','_'],['E',''],['F',''],['G','_'],['G',''],['A','_'],['A',''],['B','_'],['B','']];
  const [letter,acc]=(preferFlats?flat:sharp)[mod(midi)];
  const oct=Math.floor(midi/12)-1;
  let body;
  if(oct>=5){body=letter.toLowerCase()+"'".repeat(Math.max(0,oct-5));}
  else{body=letter+','.repeat(Math.max(0,4-oct));}
  return acc+body;
}
function renderSheet(v){
  const midis=usedMidis(v);const host=document.getElementById('chordStaff');
  if(!midis.length){host.innerHTML='<span>No playable notes for this chord.</span>';return}
  const preferFlats=selectedRoot().preferFlats;
  const pitches=midis.map(m=>abcPitch(m,preferFlats)).join('');
  const avg=midis.reduce((a,b)=>a+b,0)/midis.length;const clef=avg<57?'bass':'treble';
  const abc=`X:1\nT:${chordName()}\nM:4/4\nL:1/4\nK:C clef=${clef}\n[${pitches}]4|`;
  host.innerHTML='';
  ABCJS.renderAbc(host,abc,{responsive:'resize',add_classes:true,staffwidth:650,scale:1.15,paddingleft:18,paddingright:18,paddingtop:8,paddingbottom:8});
}

function row(label,value,muted=false){
  const r=document.createElement('div');r.className='tab-row';
  const l=document.createElement('div');l.className='tab-label';l.textContent=label;
  const line=document.createElement('div');line.className='tab-line';
  const val=document.createElement('span');val.className='tab-value'+(muted?' muted':'');val.textContent=value;
  line.appendChild(val);r.append(l,line);return r;
}
function renderTab(v){
  const host=document.getElementById('chordTab');host.innerHTML='';host.className='tab-grid';
  if(!v){host.appendChild(row('', '×', true));return}
  if(v.kind==='fretted'){
    const items=v.courses.map((course,i)=>({course,choice:v.shape[i]})).sort((a,b)=>b.course.openMidi-a.course.openMidi||b.course.course-a.course.course);
    for(const item of items){
      const label=`${item.course.course} ${item.course.openNote}`;
      host.appendChild(row(label,item.choice?item.choice.fret:'×',!item.choice));
    }
  }else if(v.kind==='fixed'){
    host.classList.add('two-bar');
    for(const bar of ['Top','Bottom']){
      const vals=v.notes.filter(n=>n.bar===bar).sort((a,b)=>a.position-b.position).map(n=>n.position);
      host.appendChild(row(bar,vals.length?vals.join('   '):'×',!vals.length));
    }
  }else{
    const chosen=new Set(v.notes.map(n=>n.string));
    const ordered=[...v.strings].sort((a,b)=>b.midi-a.midi||b.string-a.string);
    for(const s of ordered)host.appendChild(row(`${s.string} ${s.note}`,chosen.has(s.string)?'0':'×',!chosen.has(s.string)));
  }
}

function presentPcs(v){return new Set(usedMidis(v).map(mod))}
function renderInfo(v){
  const root=selectedRoot();const names=root.preferFlats?NOTE_NAMES_FLAT:NOTE_NAMES_SHARP;
  document.getElementById('toneNames').textContent=chordTonePcs().map(t=>names[t.pc]).join(' · ');
  document.getElementById('voicingNotes').textContent=usedMidis(v).map(m=>midiName(m,root.preferFlats)).join(' · ')||'None';
  const warning=document.getElementById('warningBox');warning.innerHTML='';
  if(!v){warning.innerHTML='<div class="warning-box">No playable voicing was found for this chord with the current instrument and tuning.</div>';return}
  const present=presentPcs(v);const missing=[];const seen=new Set();
  for(const t of chordTonePcs()){if(!present.has(t.pc)&&!seen.has(t.pc)){seen.add(t.pc);missing.push(names[t.pc])}}
  if(missing.length){warning.innerHTML=`<div class="warning-box">Best available voicing. Missing chord tone${missing.length===1?'':'s'}: ${missing.join(', ')}.</div>`}
  const midis=usedMidis(v);const min=midis.length?midiName(Math.min(...midis),root.preferFlats):'—';const max=midis.length?midiName(Math.max(...midis),root.preferFlats):'—';
  document.getElementById('voicingInfo').textContent=`Range ${min}–${max} · ${midis.length} note${midis.length===1?'':'s'}`;
}

function renderSelectedVoicing(){
  const index=Number(document.getElementById('voicingSelect').value||0);const v=voicings[index]||voicings[0]||null;
  document.getElementById('chordName').textContent=chordName();
  renderSheet(v);renderTab(v);renderInfo(v);
}
function voicingLabel(v,i){
  if(v.kind==='fretted'){
    const frets=v.shape.map(x=>x?x.fret:'×').join(' · ');return `${i+1} — ${frets}`;
  }
  if(v.kind==='fixed')return `${i+1} — ${v.notes.map(n=>`${n.bar[0]}${n.position}`).join(' · ')}`;
  return `${i+1} — strings ${v.notes.map(n=>n.string).join(', ')}`;
}
function regenerate(){
  voicings=generateVoicings();
  const select=document.getElementById('voicingSelect');select.innerHTML='';
  if(!voicings.length){const o=document.createElement('option');o.value='0';o.textContent='No playable voicing';select.appendChild(o)}
  else voicings.forEach((v,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=voicingLabel(v,i);select.appendChild(o)});
  renderSelectedVoicing();
}
function resetInstrumentControls(){setupSubControls();regenerate()}

const query=new URLSearchParams(location.search);
if(query.get('instrument')&&document.querySelector(`#instrumentPreset option[value="${CSS.escape(query.get('instrument'))}"]`))document.getElementById('instrumentPreset').value=query.get('instrument');

document.getElementById('instrumentPreset').addEventListener('change',resetInstrumentControls);
document.getElementById('rootSelect').addEventListener('change',regenerate);
document.getElementById('qualitySelect').addEventListener('change',regenerate);
document.getElementById('voicingSelect').addEventListener('change',renderSelectedVoicing);
document.getElementById('tabMakerBtn').addEventListener('click',()=>{location.href='index.html'});

setupSubControls();
regenerate();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harakka's ABC Archive and Tab Maker</title>
<style>
html,body{height:100%;margin:0;background:#008080;font:12px "MS Sans Serif",Tahoma,Arial,sans-serif;color:#000}
.window{position:absolute;inset:8%;background:#c0c0c0;border:2px outset #fff;box-shadow:1px 1px #000;padding:3px}
.titlebar{height:24px;background:#000080;color:#fff;font-weight:700;display:flex;align-items:center;padding:0 5px;position:relative;-webkit-app-region:drag}
.controls{margin-left:auto;display:flex;gap:2px;-webkit-app-region:no-drag}
.controls button,.dialog button{background:#c0c0c0;border:2px outset #fff;border-radius:0;color:#000;min-width:24px;height:20px;font:12px "MS Sans Serif",Tahoma,Arial,sans-serif}
.controls button:active,.dialog button:active{border-style:inset}
.dialog{margin:35px auto;width:min(520px,80%);padding:18px;background:#c0c0c0;border:2px outset #fff}
.dialog-inner{border:2px inset #fff;background:#fff;padding:18px;line-height:1.5}
.actions{margin-top:14px;text-align:center}.actions button{height:26px;min-width:90px}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">Harakka's ABC Archive and Tab Maker</div>
  <div class="dialog">
    <div class="dialog-inner">
      <strong>Could not reach the live archive.</strong><br><br>
      The desktop version loads the current GitHub Pages site so it always receives your newest songs, instruments and fixes. Check your internet connection and try again.
    </div>
    <div class="actions"><button id="offlineRetry" type="button">Retry</button></div>
  </div>
</div>
<script>document.getElementById('offlineRetry').addEventListener('click',()=>window.harakkaDesktop.retry());</script>
</body>
</html>
